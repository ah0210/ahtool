name: build

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: Build
        run: go build -buildvcs=false -trimpath -tags desktop,production -ldflags "-s -w -H windowsgui -X main.appVersion=1.0.0 -X main.buildDate=ci" -o bin/ahtool_v1.0.0.exe .
      - name: Test (safe set; manual tests are excluded by build tag)
        run: go test ./...
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ahtool-windows-amd64
          path: bin/ahtool_v1.0.0.exe
